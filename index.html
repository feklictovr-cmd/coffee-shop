<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Shop — Ароматный кофе</title>
    <style>
        :root {
            --primary: #4a2c11;
            --primary-light: #6f4e37;
            --accent: #d4a373;
            --bg: #fefae0;
            --text: #283618;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
        }

        header {
            background-color: var(--primary);
            color: var(--white);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .main-container {
                grid-template-columns: 3fr 1fr;
            }
        }

        /* Фильтры */
        .filters {
            background: var(--white);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        select {
            padding: 8px 12px;
            border: 2px solid var(--accent);
            border-radius: 6px;
            background: white;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        /* Сетка товаров */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--white);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .product-meta {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-light);
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--primary-light);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--primary);
        }

        /* Корзина */
        .cart-panel {
            background: var(--white);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .cart-item-controls input {
            width: 50px;
            padding: 3px;
            text-align: center;
            margin-left: 5px;
        }

        .checkout-form {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkout-form input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Анимационная сцена */
        #animation-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        .road-container {
            width: 100%;
            max-width: 600px;
            height: 150px;
            position: relative;
            overflow: hidden;
            border-bottom: 4px dashed #fff;
            margin-bottom: 20px;
        }

        #delivery-truck {
            position: absolute;
            bottom: 0;
            left: -150px;
            width: 120px;
            height: auto;
        }

        .drive-animation {
            animation: driveAway 3.5s forwards cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        @keyframes driveAway {
            0% { left: -150px; }
            30% { left: 40%; }
            60% { left: 40%; }
            100% { left: 110%; }
        }
    </style>
</head>
<body>

    <header>
        <h1>☕ Coffee Shop</h1>
        <div id="cart-counter">Корзина: 0 товаров</div>
    </header>

    <div class="filters">
        <select id="filter-type">
            <option value="all">Все типы</option>
            <option value="зерновой">Зерновой</option>
            <option value="молотый">Молотый</option>
            <option value="растворимый">Растворимый</option>
        </select>

        <select id="filter-volume">
            <option value="all">Любой объем</option>
            <option value="250">250 г</option>
            <option value="500">500 г</option>
            <option value="1000">1000 г</option>
        </select>
    </div>

    <div class="main-container">
        <main class="products-grid" id="products-container"></main>

        <aside class="cart-panel">
            <h2>Ваша корзина</h2>
            <div id="cart-items" style="margin-top: 15px;">
                </div>
            <h3 style="margin-top: 15px;">Итого: <span id="cart-total">0</span> руб.</h3>

            <form class="checkout-form" id="order-form" onsubmit="handleCheckout(event)">
                <input type="text" id="user-name" placeholder="Ваше Имя" required>
                <input type="text" id="user-address" placeholder="Адрес доставки" required>
                <button type="submit" class="btn" style="background-color: var(--accent); color: #000;">Заказать</button>
            </form>
        </aside>
    </div>

    <div id="animation-overlay">
        <div class="road-container">
            <svg id="delivery-truck" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="70" height="50" fill="#6f4e37" rx="5"/>
                <path d="M80 30 L105 30 L115 50 L115 60 L80 60 Z" fill="#4a2c11"/>
                <path d="M85 35 L100 35 L107 48 L85 48 Z" fill="#e0f7fa"/>
                <circle cx="30" cy="65" r="10" fill="#222"/>
                <circle cx="30" cy="65" r="4" fill="#fff"/>
                <circle cx="90" cy="65" r="10" fill="#222"/>
                <circle cx="90" cy="65" r="4" fill="#fff"/>
                <ellipse cx="45" cy="35" rx="12" ry="8" fill="#d4a373" transform="rotate(-30 45 35)"/>
                <path d="M35 39 Q45 31 55 31" stroke="#4a2c11" stroke-width="2" fill="none" transform="rotate(-30 45 35)"/>
            </svg>
        </div>
        <h2 id="animation-status">Ваш заказ оформляется...</h2>
    </div>

    <script>
        // Исходная база данных кофе (Имитация склада)
        const coffeeProducts = [
            { id: 1, name: "Арабика Эфиопия", type: "зерновой", volume: 250, price: 450, stock: 5 },
            { id: 2, name: "Робуста Уганда", type: "зерновой", volume: 500, price: 780, stock: 3 },
            { id: 3, name: "Колумбия Супремо", type: "молотый", volume: 250, price: 490, stock: 8 },
            { id: 4, name: "Итальянская обжарка", type: "молотый", volume: 1000, price: 1350, stock: 2 },
            { id: 5, name: "Сублимированный Classic", type: "растворимый", volume: 250, price: 350, stock: 10 },
            { id: 6, name: "Декаф (Без кофеина)", type: "зерновой", volume: 250, price: 550, stock: 4 }
        ];

        // Инициализация корзины из localStorage или создание новой
        let cart = JSON.parse(localStorage.getItem('coffee_cart')) || [];

        // Элементы DOM
        const productsContainer = document.getElementById('products-container');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        const cartCounter = document.getElementById('cart-counter');
        const typeFilter = document.getElementById('filter-type');
        const volumeFilter = document.getElementById('filter-volume');

        // 1. ФУНКЦИОНАЛ: Рендеринг и Фильтрация продукции
        function renderProducts() {
            const selectedType = typeFilter.value;
            const selectedVolume = volumeFilter.value;

            productsContainer.innerHTML = '';

            const filtered = coffeeProducts.filter(product => {
                const matchesType = selectedType === 'all' || product.type === selectedType;
                const matchesVolume = selectedVolume === 'all' || product.volume === parseInt(selectedVolume);
                return matchesType && matchesVolume;
            });

            if(filtered.length === 0) {
                productsContainer.innerHTML = '<p>Товары не найдены.</p>';
                return;
            }

            filtered.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <h3>${product.name}</h3>
                        <p class="product-meta">Тип: ${product.type} | Объем: ${product.volume}г</p>
                        <p style="font-size: 12px; color: green">Остаток на складе: ${product.stock} шт.</p>
                    </div>
                    <div>
                        <p class="price">${product.price} руб.</p>
                        <button class="btn" onclick="addToCart(${product.id})">В корзину</button>
                    </div>
                `;
                productsContainer.appendChild(card);
            });
        }

        // 2. ФУНКЦИОНАЛ: Корзина (Добавление, Проверка количества, Изменение)
        function addToCart(productId) {
            const product = coffeeProducts.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);
            const currentCount = cartItem ? cartItem.count : 0;

            // Проверка наличия заданного количества на складе
            if (currentCount + 1 > product.stock) {
                alert(`Извините! На складе осталось всего ${product.stock} шт. товара "${product.name}". Больше добавить нельзя.`);
                return;
            }

            if (cartItem) {
                cartItem.count++;
            } else {
                cart.push({ ...product, count: 1 });
            }

            updateCart();
        }

        function changeCount(productId, newCount) {
            const product = coffeeProducts.find(p => p.id === productId);
            const cartItem = cart.find(item => item.id === productId);

            if (newCount > product.stock) {
                alert(`Ошибка! Доступно только ${product.stock} шт.`);
                updateCart(); // Сбрасываем значение инпута обратно
                return;
            }

            if (newCount <= 0) {
                cart = cart.filter(item => item.id !== productId);
            } else {
                cartItem.count = parseInt(newCount);
            }
            updateCart();
        }

        function updateCart() {
            localStorage.setItem('coffee_cart', JSON.stringify(cart));
            renderCart();
        }

        function renderCart() {
            cartItemsContainer.innerHTML = '';
            let total = 0;
            let totalItems = 0;

            cart.forEach(item => {
                total += item.price * item.count;
                totalItems += item.count;

                const itemRow = document.createElement('div');
                itemRow.className = 'cart-item';
                itemRow.innerHTML = `
                    <div>
                        <div><strong>${item.name}</strong></div>
                        <div>${item.price} руб.</div>
                    </div>
                    <div class="cart-item-controls">
                        <input type="number" value="${item.count}" min="0" onchange="changeCount(${item.id}, this.value)">
                    </div>
                `;
                cartItemsContainer.appendChild(itemRow);
            });

            cartTotal.textContent = total;
            cartCounter.textContent = `Корзина: ${totalItems} товаров`;
        }

        // 3. ФУНКЦИОНАЛ: Анимация SVG при оформлении заказа
        function handleCheckout(event) {
            event.preventDefault();

            if (cart.length === 0) {
                alert("Ваша корзина пуста!");
                return;
            }

            const name = document.getElementById('user-name').value;
            const address = document.getElementById('user-address').value;

            // Показываем оверлей с анимацией грузовика
            const overlay = document.getElementById('animation-overlay');
            const truck = document.getElementById('delivery-truck');
            const statusText = document.getElementById('animation-status');

            overlay.style.display = 'flex';
            statusText.textContent = `${name}, собираем ваш заказ...`;
            truck.classList.add('drive-animation');

            // Изменение этапов надписей во время движения грузовика
            setTimeout(() => {
                statusText.textContent = "Грузовик с логотипом выехал по адресу: " + address;
            }, 1500);

            
            setTimeout(() => {
                truck.classList.remove('drive-animation');
                overlay.style.display = 'none';
                
                // Очистка данных
                cart = [];
                updateCart();
                document.getElementById('order-form').reset();
                
                alert("Заказ успешно доставлен (эмуляция завершена)!");
            }, 3800);
        }

        // Навешивание слушателей на фильтры
        typeFilter.addEventListener('change', renderProducts);
        volumeFilter.addEventListener('change', renderProducts);

        // Первая инициализация при загрузке страницы
        renderProducts();
        renderCart();
    </script>
</body>
</html>
